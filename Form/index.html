<html>
    <head>
        <title>Form Assignment</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>RegistrationForm</h1>
        <h2>Kindly fill in the details below:</h2>
        <form>
            <label for="name">Username:</label><br>
            <input type="text" id="name" name="name" required placeholder="Enter your UserName"><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required placeholder="Enter your Email"><br><br>

            <label for="password">Password:</label><br>
            <input type="text" id="password" name="password" required placeholder="Enter your Password"><br><br>

            <label for="Repeat">Repeat Password:</label><br>
            <input type="text" id="Repeat" name="Repeat" required placeholder="Repeat your Password"><br><br>

            <h3>Already have an account? <a href="login.html">Login here</a></h3>


            <button type="submit">Register</button>
        </form>
    </body>
</html>
